[project]
name = "huashipping"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "django>=6.0,<6.1",
    "django-simple-history>=3.7",
    "openpyxl>=3.1",
    "gunicorn>=23",
    "whitenoise>=6.8",
    "dj-database-url>=2.3",
    "psycopg[binary]>=3.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-django>=4.9",
    "ruff>=0.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
DJANGO_SETTINGS_MODULE = "config.settings"

[tool.ruff]
line-length = 110
target-version = "py312"
exclude = [".venv", "config/settings.py", "voyages/migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
