<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HUA Agro Trans — Database Voyage (Prototipe)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#14293A;         /* harbor navy */
  --ink-soft:#4A5E6D;
  --bg:#ECF1F0;          /* sea glass */
  --card:#FFFFFF;
  --line:#D7DFDD;
  --stbd:#0E7A66;        /* starboard green — done / primary */
  --stbd-soft:#E3F1ED;
  --port:#BE4128;        /* port red — alerts / overdue */
  --port-soft:#F8E9E5;
  --amber:#A87A1F;       /* underway / in progress */
  --amber-soft:#F6EEDC;
  --navy-soft:#E4EAF0;
  --disp:"Barlow Condensed",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --body:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --rad:10px;
  --shadow:0 1px 2px rgba(20,41,58,.06),0 4px 14px rgba(20,41,58,.05);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--body)}
button{font:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:var(--ink)}
:focus-visible{outline:2px solid var(--stbd);outline-offset:2px;border-radius:4px}

/* ---------- shell ---------- */
#app{display:grid;grid-template-columns:232px 1fr;min-height:100vh}
.side{background:var(--ink);color:#DCE6EC;padding:20px 16px;display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh}
.brand{margin-bottom:14px}
.brand .co{font-family:var(--disp);font-weight:700;font-size:24px;letter-spacing:.06em;color:#fff;line-height:1}
.brand .sub{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;color:#8FA6B4;text-transform:uppercase;margin-top:5px}
.nav-btn{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;background:none;border:0;color:#C5D3DC;padding:9px 10px;border-radius:8px;font-size:14.5px}
.nav-btn:hover{background:rgba(255,255,255,.07);color:#fff}
.nav-btn.on{background:rgba(255,255,255,.12);color:#fff;font-weight:600}
.nav-btn .n{font-family:var(--mono);font-size:11px;color:#8FA6B4}
.side .foot{margin-top:auto;display:flex;flex-direction:column;gap:8px}
.side .foot .note{font-size:11.5px;color:#7E96A5;line-height:1.45}
.ghost-w{background:none;border:1px solid rgba(255,255,255,.25);color:#D5E1E8;border-radius:8px;padding:7px 10px;font-size:13px}
.ghost-w:hover{border-color:rgba(255,255,255,.55);color:#fff}

.main{padding:26px 34px 60px;max-width:1120px;width:100%;margin:0 auto}
.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:20px;flex-wrap:wrap}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-soft)}
h1{font-family:var(--disp);font-weight:600;font-size:32px;letter-spacing:.01em;margin:2px 0 0;line-height:1.1}
.page-sub{color:var(--ink-soft);font-size:14px;margin-top:4px;max-width:640px}

/* ---------- buttons ---------- */
.btn{border:0;border-radius:8px;padding:9px 15px;font-weight:600;font-size:14px}
.btn.pri{background:var(--stbd);color:#fff}
.btn.pri:hover{background:#0B6353}
.btn.sec{background:#fff;border:1px solid var(--line);color:var(--ink)}
.btn.sec:hover{border-color:#B9C6C3}
.btn.sm{padding:6px 11px;font-size:13px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.linkish{background:none;border:0;color:var(--stbd);font-weight:600;padding:0;font-size:13.5px}
.linkish:hover{text-decoration:underline}
.x-btn{background:none;border:0;color:var(--ink-soft);font-size:15px;padding:2px 6px;border-radius:6px}
.x-btn:hover{color:var(--port);background:var(--port-soft)}

/* ---------- cards & tables ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--rad);box-shadow:var(--shadow)}
.card .card-h{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:13px 16px;border-bottom:1px solid var(--line)}
.card .card-h h3{margin:0;font-family:var(--disp);font-weight:600;font-size:19px;letter-spacing:.02em}
.card .card-b{padding:14px 16px}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft);text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);font-weight:500}
.tbl td{padding:9px 10px;border-bottom:1px solid #EDF1F0;vertical-align:top}
.tbl tr:last-child td{border-bottom:0}
.tbl .num{font-family:var(--mono);font-size:13px;text-align:right;white-space:nowrap}
.tbl tfoot td{border-top:1.5px solid var(--ink);border-bottom:0;font-weight:600}
.row-click{cursor:pointer}
.row-click:hover td{background:#F5F8F7}
.empty{padding:22px 16px;color:var(--ink-soft);font-size:14px;text-align:center}
.empty b{color:var(--ink)}

/* ---------- chips ---------- */
.chip{display:inline-block;font-family:var(--mono);font-size:11px;letter-spacing:.05em;padding:3px 9px;border-radius:999px;border:1px solid transparent;white-space:nowrap}
.c-plan{background:#EEF1F3;color:#5A6B77;border-color:#D9E0E4}
.c-load,.c-disch{background:var(--amber-soft);color:var(--amber);border-color:#E7D8B4}
.c-sea{background:var(--navy-soft);color:#2C4A66;border-color:#CBD8E4}
.c-done{background:var(--stbd-soft);color:var(--stbd);border-color:#BFDED4}
.c-alert{background:var(--port-soft);color:var(--port);border-color:#EBC7BD}
.c-hollow{background:#fff;color:var(--ink-soft);border-color:var(--line)}

/* ---------- KPI tiles ---------- */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:22px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--rad);box-shadow:var(--shadow);padding:14px 16px}
.kpi .k-label{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft)}
.kpi .k-val{font-family:var(--disp);font-weight:700;font-size:34px;line-height:1.05;margin-top:6px}
.kpi .k-val small{font-size:17px;font-weight:600;color:var(--ink-soft);margin-left:2px}
.kpi .k-sub{font-size:12px;color:var(--ink-soft);margin-top:3px}
.kpi.good .k-val{color:var(--stbd)}
.kpi.warn .k-val{color:var(--port)}

/* ---------- passage line (signature) ---------- */
.passage{padding:6px 2px 2px}
.p-ends{display:flex;justify-content:space-between;font-family:var(--disp);font-weight:600;font-size:15px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink);margin-bottom:8px}
.p-ends .arrow{color:var(--ink-soft);font-weight:400}
.p-track{position:relative;height:34px}
.p-track .rail{position:absolute;left:5px;right:5px;top:8px;height:2px;background:var(--line)}
.p-track .fill{position:absolute;left:5px;top:8px;height:2px;background:var(--stbd);transition:width .3s}
.p-node{position:absolute;top:3px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:5px}
.p-dot{width:12px;height:12px;border-radius:50%;background:#fff;border:2px solid var(--line)}
.p-node.done .p-dot{background:var(--stbd);border-color:var(--stbd)}
.p-node.now .p-dot{background:#fff;border-color:var(--stbd);box-shadow:0 0 0 3px var(--stbd-soft)}
.p-lab{font-family:var(--mono);font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft);white-space:nowrap}
.p-node.done .p-lab,.p-node.now .p-lab{color:var(--stbd);font-weight:500}
.passage.mini .p-ends{font-size:12.5px;margin-bottom:5px}
.passage.mini .p-track{height:26px}
.passage.mini .p-lab{display:none}

/* ---------- voyage list ---------- */
.voy-card{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:var(--rad);box-shadow:var(--shadow);padding:15px 18px;margin-bottom:12px}
.voy-card:hover{border-color:#AFC4BE}
.voy-top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:8px}
.voy-code{font-family:var(--mono);font-size:13px;font-weight:500}
.voy-vessel{font-weight:600}
.voy-meta{display:flex;gap:18px;flex-wrap:wrap;color:var(--ink-soft);font-size:13px;margin-top:8px}
.voy-meta b{color:var(--ink);font-family:var(--mono);font-weight:500;font-size:12.5px}

/* ---------- voyage detail ---------- */
.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px}
.detail-grid .card{align-self:start}
.doc-row{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;background:none;border:0;border-bottom:1px solid #EDF1F0;padding:8px 4px;text-align:left}
.doc-row:hover{background:#F5F8F7}
.doc-row:last-child{border-bottom:0}
.doc-row .d-name{font-size:14px}
.doc-row .d-date{font-family:var(--mono);font-size:11px;color:var(--ink-soft);margin-left:8px}
.doc-group{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft);padding:12px 4px 4px}
.call-card{border:1px solid var(--line);border-radius:8px;padding:12px 14px;margin-bottom:10px}
.call-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px}
.call-head b{font-family:var(--disp);font-size:17px;font-weight:600;letter-spacing:.02em}
.t-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.t-cell .t-lab{font-family:var(--mono);font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft)}
.t-cell .t-val{font-family:var(--mono);font-size:12px;margin-top:2px}
.call-stats{display:flex;gap:16px;margin-top:9px;font-size:12.5px;color:var(--ink-soft)}
.call-stats b{font-family:var(--mono);color:var(--ink);font-weight:500}
.inv-line{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid #EDF1F0;font-size:14px}
.inv-line:last-of-type{border-bottom:0}
.inv-line .k{color:var(--ink-soft)}
.inv-line .v{font-family:var(--mono);font-size:13px;text-align:right}
.big-money{font-family:var(--disp);font-weight:700;font-size:30px;margin:6px 0 2px}

/* ---------- alerts ---------- */
.alert-row{display:flex;align-items:center;gap:10px;padding:9px 4px;border-bottom:1px solid #EDF1F0;font-size:14px}
.alert-row:last-child{border-bottom:0}
.alert-dot{width:8px;height:8px;border-radius:50%;flex:none}
.alert-dot.red{background:var(--port)}
.alert-dot.amber{background:var(--amber)}

/* ---------- intro ---------- */
.intro{background:var(--ink);color:#DCE6EC;border-radius:var(--rad);padding:16px 20px;margin-bottom:20px;display:flex;justify-content:space-between;gap:18px;align-items:flex-start}
.intro h3{margin:0 0 6px;font-family:var(--disp);font-weight:600;font-size:19px;color:#fff;letter-spacing:.02em}
.intro p{margin:0;font-size:13.5px;line-height:1.55;color:#C5D3DC;max-width:760px}
.intro .x-btn{color:#8FA6B4}
.intro .x-btn:hover{color:#fff;background:rgba(255,255,255,.1)}

/* ---------- modal ---------- */
#modal{position:fixed;inset:0;background:rgba(16,32,44,.45);display:none;align-items:flex-start;justify-content:center;padding:6vh 16px;z-index:50;overflow:auto}
#modal.open{display:flex}
.modal-card{background:#fff;border-radius:12px;box-shadow:0 20px 60px rgba(10,25,35,.35);width:100%;max-width:520px;animation:pop .16s ease-out}
@keyframes pop{from{transform:translateY(8px);opacity:.6}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.modal-card{animation:none}.p-track .fill{transition:none}}
.modal-card .m-h{display:flex;justify-content:space-between;align-items:center;padding:15px 18px;border-bottom:1px solid var(--line)}
.modal-card .m-h h3{margin:0;font-family:var(--disp);font-weight:600;font-size:21px;letter-spacing:.02em}
.modal-card .m-b{padding:16px 18px;display:grid;gap:12px}
.modal-card .m-f{padding:13px 18px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:10px}
.field label{display:block;font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft);margin-bottom:4px}
.field input,.field select{width:100%;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:#fff;font-size:14px}
.field input:focus,.field select:focus{border-color:var(--stbd);outline:none;box-shadow:0 0 0 3px var(--stbd-soft)}
.f-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.hint{font-size:12px;color:var(--ink-soft)}

/* ---------- print ---------- */
#print-sheet{display:none}
@media print{
  body{background:#fff}
  #app,#modal{display:none!important}
  #print-sheet{display:block;font:13px/1.55 var(--body);color:#111;padding:10px}
  .ps-head{display:flex;justify-content:space-between;border-bottom:3px solid #14293A;padding-bottom:12px;margin-bottom:18px}
  .ps-co{font-family:var(--disp);font-weight:700;font-size:26px;letter-spacing:.05em}
  .ps-co small{display:block;font-family:var(--mono);font-size:10px;letter-spacing:.1em;font-weight:400;color:#555;margin-top:4px}
  .ps-inv{text-align:right}
  .ps-inv .t{font-family:var(--disp);font-size:22px;font-weight:600;letter-spacing:.08em}
  .ps-meta{display:grid;grid-template-columns:1fr 1fr;gap:4px 30px;margin:14px 0 18px;font-size:12.5px}
  .ps-meta div b{display:inline-block;min-width:110px;font-weight:600}
  #print-sheet table{width:100%;border-collapse:collapse;font-size:12.5px}
  #print-sheet th{text-align:left;border-bottom:1.5px solid #14293A;padding:6px 8px;font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase}
  #print-sheet td{padding:7px 8px;border-bottom:1px solid #ddd}
  #print-sheet .num{text-align:right;font-family:var(--mono)}
  #print-sheet tfoot td{border-top:2px solid #14293A;border-bottom:0;font-weight:700}
  .ps-foot{margin-top:26px;font-size:11.5px;color:#444}
}

/* ---------- responsive ---------- */
@media (max-width:940px){
  .kpis{grid-template-columns:1fr 1fr}
  .detail-grid{grid-template-columns:1fr}
  .t-grid{grid-template-columns:repeat(3,1fr)}
}
@media (max-width:760px){
  #app{grid-template-columns:1fr}
  .side{position:static;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center;gap:8px;padding:12px 14px}
  .brand{margin:0 10px 0 0}
  .nav-btn{width:auto;padding:7px 10px}
  .nav-btn .n{display:none}
  .side .foot{margin:0 0 0 auto;flex-direction:row}
  .side .foot .note{display:none}
  .main{padding:18px 14px 50px}
}

/* ---------- v2: recap database additions ---------- */
.tbl-wrap{overflow-x:auto;border-radius:var(--rad)}
.tbl.compact td{padding:7px 8px;font-size:13px;white-space:nowrap}
.tbl.compact th{white-space:nowrap}
th.sort{cursor:pointer;user-select:none}
th.sort:hover{color:var(--ink)}
.filters{display:flex;gap:10px;flex-wrap:wrap;margin:0 0 14px;align-items:center}
.filters input[type=search],.filters select{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:#fff;font-size:13.5px}
.filters input[type=search]{min-width:210px}
.mini-track{background:#E2EAE8;border-radius:3px;height:6px;width:100px;margin-top:5px}
.mini-bar{height:6px;background:var(--stbd);border-radius:3px;min-width:2px}
.sub-cell{font-size:11px;color:var(--ink-soft);font-family:var(--mono);white-space:nowrap}
.res-pos{color:var(--stbd)!important}
.res-neg{color:var(--port)!important}
.form-3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.form-4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.f-sec{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft);border-bottom:1px solid var(--line);padding-bottom:5px;margin-top:4px}
.calc-strip{background:var(--stbd-soft);border:1px solid #BFDED4;border-radius:8px;padding:10px 12px;font-size:13px;display:flex;gap:18px;flex-wrap:wrap}
.calc-strip b{font-family:var(--mono);font-weight:500}
.modal-card.wide{max-width:660px}
.recap-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px}
.rc-line{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid #EDF1F0;font-size:14px}
.rc-line:last-child{border-bottom:0}
.rc-line .k{color:var(--ink-soft)}
.rc-line .v{font-family:var(--mono);font-size:13px;text-align:right}
.days-strip{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:4px}
.day-box{border:1px solid var(--line);border-radius:8px;padding:9px 10px;text-align:center}
.day-box .lb{font-family:var(--mono);font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft)}
.day-box .vl{font-family:var(--disp);font-weight:700;font-size:22px;margin-top:2px}
.day-box.tot{background:var(--ink);border-color:var(--ink)}
.day-box.tot .lb{color:#9FB3BF}
.day-box.tot .vl{color:#fff}
.fine{font-size:11.5px;color:var(--ink-soft);margin-top:8px}
@media(max-width:940px){.recap-grid{grid-template-columns:1fr}}
@media(max-width:760px){.form-3,.form-4{grid-template-columns:1fr 1fr}.days-strip{grid-template-columns:repeat(3,1fr)}}

/* ---------- v3: activity log / timeline ---------- */
.detail-grid2{display:grid;grid-template-columns:3fr 2fr;gap:16px;margin-top:16px}
.tl-row{display:flex;align-items:center;gap:10px;padding:8px 4px;border-bottom:1px solid #EDF1F0;font-size:13.5px}
.tl-row:last-child{border-bottom:0}
.tl-dot{width:9px;height:9px;border-radius:50%;flex:none;background:var(--line)}
.tl-dot.ph-ballast,.tl-dot.ph-laden{background:#2C4A66}
.tl-dot.ph-wl,.tl-dot.ph-wd{background:var(--amber)}
.tl-dot.ph-load,.tl-dot.ph-dis{background:var(--stbd)}
.tl-dot.ph-prep{background:#8AA0AC}
.tl-main{flex:1;min-width:0}
.tl-type{font-weight:600}
.tl-note{color:var(--ink-soft);font-size:12px}
.tl-time{font-family:var(--mono);font-size:11.5px;color:var(--ink-soft);white-space:nowrap;text-align:right}
.tl-dur{font-family:var(--mono);font-size:12.5px;font-weight:500;width:56px;text-align:right;white-space:nowrap}
.tl-gap{background:var(--port-soft);border-radius:8px;margin:4px 0;padding:7px 12px;font-size:12.5px;color:var(--port);display:flex;justify-content:space-between;gap:10px}
.tl-ongoing{background:var(--stbd-soft);border-radius:8px}
.lock-chip{font-family:var(--mono);font-size:10.5px;color:var(--ink-soft);border:1px solid var(--line);border-radius:999px;padding:3px 9px;background:#fff}
.bar-row{display:flex;align-items:center;gap:12px;padding:7px 0;font-size:13.5px}
.bar-lab{width:150px;flex:none}
.bar-track{flex:1;background:#E2EAE8;border-radius:4px;height:14px;position:relative}
.bar-fill{height:14px;border-radius:4px;background:var(--stbd)}
.bar-fill.warn{background:var(--port)}
.bar-fill.mid{background:#2C4A66}
.bar-val{font-family:var(--mono);font-size:12px;width:110px;text-align:right;white-space:nowrap}
.master-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.ps-sig{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:34px;text-align:center;font-size:12.5px}
.ps-sig .line{margin-top:52px;border-top:1px solid #333;padding-top:4px}
@media(max-width:940px){.detail-grid2{grid-template-columns:1fr}.master-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="app">
  <aside class="side">
    <div class="brand">
      <div class="co">HUA AGRO TRANS</div>
      <div class="sub">Database voyage · prototipe</div>
    </div>
    <nav id="nav" aria-label="Main"></nav>
    <div class="foot">
      <button class="ghost-w" onclick="App.exportJSON()">Export data (JSON)</button>
      <button class="ghost-w" onclick="App.resetDemo()">Reset ke data asli</button>
      <div class="note">Log kegiatan per voyage — data asli dari time sheet Excel. Export CSV kapan saja untuk membuka di Excel. Data is saved automatically on this device.</div>
    </div>
  </aside>
  <main class="main" id="main"></main>
</div>
<div id="modal" onclick="if(event.target===this)App.closeModal()"></div>
<div id="print-sheet"></div>

'use strict';
/* PT HUA Agro Trans — Database Voyage (prototipe v3)
   Inti: log kegiatan bertimestamp per voyage. Semua angka hari DIHITUNG, bukan diketik. */

const SKEY='hua-vlog-v1';
const NOW=Date.now();
const TYPES=[
 {id:'ballast',        label:'Perjalanan ke lokasi muat (ballast)', ph:'ballast'},
 {id:'tunggu-sandar-m',label:'Tunggu info sandar (muat)',           ph:'wl'},
 {id:'tunggu-muat',    label:'Tunggu info muat',                    ph:'wl'},
 {id:'muat',           label:'Kegiatan muat',                       ph:'load'},
 {id:'tunggu-castoff', label:'Tunggu info cast off',                ph:'wl'},
 {id:'shifting',       label:'Shifting antar jetty',                ph:'wl'},
 {id:'laden',          label:'Perjalanan ke lokasi bongkar (layar isi)', ph:'laden'},
 {id:'tunggu-sandar-b',label:'Tunggu info sandar (bongkar)',        ph:'wd'},
 {id:'tunggu-bongkar', label:'Tunggu info bongkar',                 ph:'wd'},
 {id:'bongkar',        label:'Kegiatan bongkar',                    ph:'dis'},
 {id:'persiapan',      label:'Persiapan / lain-lain',               ph:'prep'}
];
const PH_LABEL={ballast:'Ballast', wl:'Tunggu muat', load:'Muat', laden:'Layar isi', wd:'Tunggu bongkar', dis:'Bongkar', prep:'Persiapan'};
const PH_ORDER=['ballast','wl','load','laden','wd','dis','prep'];
const COMMODITIES=['CPO','RBD Palm Olein','RBD Palm Stearin','CPKO','PFAD','Palm Kernel Expeller'];

let state=null;

/* ---------- persistence ---------- */
async function persist(){ try{ if(window.storage) await window.storage.set(SKEY, JSON.stringify(state)); }catch(e){} }
async function restore(){
  try{ if(window.storage){ const r=await window.storage.get(SKEY); if(r&&r.value) return JSON.parse(r.value); } }catch(e){}
  return null;
}
function seedState(){
  const s=JSON.parse(JSON.stringify(SEED));
  s.view={name:'rekap'}; s.introDismissed=false;
  s.ui={q:'',vessel:'',status:'',sort:{key:'mulai',dir:-1}};
  return s;
}

/* ---------- helpers ---------- */
function esc(x){ return String(x==null?'':x).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
function uid(kind,prefix){ return prefix+'-'+(state.seq[kind]++); }
function num(x){ return (x==null||x===''||isNaN(x))?null:Number(x); }
const MMM=['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
function fmtHr(n,d){ return n==null?'—':Number(n).toLocaleString('id-ID',{minimumFractionDigits:0,maximumFractionDigits:d==null?1:d}); }
function fmtIDR(n){ return n==null?'—':'Rp '+Math.round(n).toLocaleString('id-ID'); }
function fmtIDRshort(n){
  if(n==null) return '—';
  const a=Math.abs(n), s=n<0?'-':'';
  if(a>=1e9) return s+'Rp '+(a/1e9).toLocaleString('id-ID',{maximumFractionDigits:2})+' M';
  if(a>=1e6) return s+'Rp '+(a/1e6).toLocaleString('id-ID',{maximumFractionDigits:0})+' jt';
  return s+fmtIDR(a);
}
function pd(s){ if(!s) return null; const d=new Date(s); return isNaN(d)?null:d; }
function fmtD(s){ const d=pd(s); if(!d) return '—'; return d.getDate()+' '+MMM[d.getMonth()]; }
function fmtDT(s){ const d=pd(s); if(!d) return '—';
  return d.getDate()+' '+MMM[d.getMonth()]+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); }
function nowLocal(){ const d=new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')+'T'+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); }
function typeById(id){ return TYPES.find(function(t){return t.id===id;}); }
function vesselById(id){ return state.vessels.find(function(v){return v.id===id;}); }
function jettyById(id){ return state.jetties.find(function(j){return j.id===id;}); }
function charterById(id){ return state.charterers.find(function(c){return c.id===id;}); }
function voyageById(id){ return state.voyages.find(function(v){return v.id===id;}); }
function vesselShort(vs){ return vs? vs.name.replace('TB HUA Navigator','HN').replace('/ BG Palm Hero','/ PH') : '—'; }
function jettyName(id){ const j=jettyById(id); return j? j.nama : '—'; }
function jettyFull(id){ const j=jettyById(id); return j? j.nama+', '+j.pelabuhan : '—'; }

/* ---------- derived ---------- */
function actsOf(v){
  return v.acts.slice().sort(function(a,b){ return (a.start||'9999').localeCompare(b.start||'9999'); });
}
function durOf(a){
  const s=pd(a.start); if(!s) return null;
  const e=a.end?pd(a.end):new Date(NOW);
  const d=(e-s)/864e5;
  return Math.round(d*100)/100;
}
function ladenBefore(acts,i){
  for(let k=0;k<i;k++) if(typeById(acts[k].typeId).ph==='laden') return true;
  return false;
}
function gapsOf(v){
  const acts=actsOf(v), out=[];
  for(let i=0;i<acts.length-1;i++){
    const e=pd(acts[i].end), s=pd(acts[i+1].start);
    if(!e||!s) continue;
    const g=(s-e)/864e5;
    if(g>0.02) out.push({after:i, days:Math.round(g*100)/100, ph: ladenBefore(acts,i+1)?'wd':'wl'});
    else if(g<-0.02) out.push({after:i, days:Math.round(g*100)/100, ph:'overlap'});
  }
  return out;
}
function phaseTotals(v){
  const t={ballast:0,wl:0,load:0,laden:0,wd:0,dis:0,prep:0};
  const acts=actsOf(v);
  acts.forEach(function(a){ const d=durOf(a); if(d!=null&&d>0) t[typeById(a.typeId).ph]+=d; });
  gapsOf(v).forEach(function(g){ if(g.ph!=='overlap') t[g.ph]+=g.days; });
  PH_ORDER.forEach(function(k){ t[k]=Math.round(t[k]*10)/10; });
  t.waiting=Math.round((t.wl+t.wd)*10)/10;
  t.port=Math.round((t.wl+t.load+t.wd+t.dis)*10)/10;
  const starts=acts.map(function(a){return pd(a.start);}).filter(Boolean);
  const ends=acts.map(function(a){return a.end?pd(a.end):new Date(NOW);}).filter(Boolean);
  t.total=starts.length? Math.round((Math.max.apply(null,ends)-Math.min.apply(null,starts))/864e5*10)/10 : null;
  t.mulai=starts.length? new Date(Math.min.apply(null,starts)) : null;
  t.selesai=(v.status==='Selesai'&&ends.length)? new Date(Math.max.apply(null,ends)) : null;
  return t;
}
function totalMT(v){ return v.parcels.reduce(function(t,p){ return t+(num(p.mt)||0); },0)||null; }
function layDiff(v,t){
  if(v.laytime==null||t.port==null) return null;
  return Math.round((t.port-v.laytime)*10)/10;
}
function demEst(v,t){
  const d=layDiff(v,t);
  if(d==null||d<=0||!v.demRate) return null;
  return d*v.demRate;
}
function ongoingAct(v){ return actsOf(v).find(function(a){ return a.start && !a.end; }); }
function currentPhase(v){
  const acts=actsOf(v);
  if(!acts.length) return '—';
  const last=acts[acts.length-1];
  return PH_LABEL[typeById(last.typeId).ph];
}
function statusChip(v){
  return v.status==='Selesai'
    ? '<span class="chip c-done">Selesai</span>'
    : '<span class="chip c-load">Berjalan · '+esc(currentPhase(v))+'</span>';
}

/* ---------- filter & sort ---------- */
function filtered(){
  const u=state.ui, q=(u.q||'').toLowerCase();
  return state.voyages.filter(function(v){
    if(u.vessel && v.vesselId!==u.vessel) return false;
    if(u.status && v.status!==u.status) return false;
    if(q){
      const ch=charterById(v.chartererId);
      const hay=[v.code,v.kontrak,v.inv,ch?ch.kode:'',ch?ch.nama:'',
        v.loadJettyIds.map(jettyFull).join(' '), jettyFull(v.dischJettyId)].join(' ').toLowerCase();
      if(hay.indexOf(q)<0) return false;
    }
    return true;
  });
}
function sortVal(v,key){
  const t=phaseTotals(v);
  switch(key){
    case 'voy': return v.code;
    case 'mulai': return t.mulai? t.mulai.getTime():null;
    case 'total': return t.total;
    case 'tunggu': return t.waiting;
    case 'port': return t.port;
    default: return '';
  }
}
function sorted(list){
  const s=state.ui.sort;
  return list.slice().sort(function(a,b){
    let x=sortVal(a,s.key), y=sortVal(b,s.key);
    if(x==null&&y==null) return 0;
    if(x==null) return 1;
    if(y==null) return -1;
    const c=(typeof x==='number')? x-y : String(x).localeCompare(String(y));
    return c*s.dir;
  });
}
function thSort(key,label,align){
  const s=state.ui.sort, arrow=s.key===key?(s.dir>0?' ▲':' ▼'):'';
  return '<th class="sort" '+(align?'style="text-align:'+align+'"':'')+' onclick="App.sortBy(\''+key+'\')">'+label+arrow+'</th>';
}

/* ---------- view: rekap ---------- */
function viewRekap(){
  const done=state.voyages.filter(function(v){return v.status==='Selesai';});
  const dTot=done.map(phaseTotals);
  const sumTotal=dTot.reduce(function(a,t){return a+(t.total||0);},0);
  const sumWait=dTot.reduce(function(a,t){return a+(t.waiting||0);},0);
  const waitPct=sumTotal? Math.round(sumWait/sumTotal*1000)/10 : null;
  const allTot=state.voyages.map(phaseTotals).reduce(function(a,t){return a+(t.total||0);},0);
  const over=done.reduce(function(a,v){ const d=layDiff(v,phaseTotals(v)); return a+(d>0?d:0); },0);
  const berjalan=state.voyages.filter(function(v){return v.status==='Berjalan';}).length;

  const intro=state.introDismissed?'':
    '<div class="intro"><div><h3>Log kegiatan sebagai inti — semua angka dihitung, bukan diketik</h3>'+
    '<p>Kesepuluh voyage di bawah adalah data asli dari time sheet Excel HN 1 & HN 2, diimpor apa adanya — termasuk jeda waktu yang tidak tercatat dan tumpang tindih jam (ditandai merah di halaman voyage). Buka satu voyage untuk melihat log kegiatan, ringkasan hari per fase, perbandingan laytime vs kontrak, dan tombol <b>Cetak time sheet</b> yang menghasilkan kembali dokumen seperti format Excel lama.</p></div>'+
    '<button class="x-btn" onclick="App.dismissIntro()" aria-label="Tutup">✕</button></div>';

  const u=state.ui;
  const filterBar='<div class="filters">'+
    '<input type="search" placeholder="Cari voy, kontrak, charterer, jetty…" value="'+esc(u.q)+'" oninput="App.setFilter(\'q\',this.value)">'+
    '<select onchange="App.setFilter(\'vessel\',this.value)"><option value="">Semua kapal</option>'+
      state.vessels.map(function(vs){return '<option value="'+vs.id+'" '+(u.vessel===vs.id?'selected':'')+'>'+esc(vesselShort(vs))+'</option>';}).join('')+'</select>'+
    '<select onchange="App.setFilter(\'status\',this.value)"><option value="">Berjalan + Selesai</option>'+
      ['Berjalan','Selesai'].map(function(s){return '<option '+(u.status===s?'selected':'')+'>'+s+'</option>';}).join('')+'</select>'+
    '<span class="hint" style="margin-left:auto">'+filtered().length+' dari '+state.voyages.length+' voyage</span></div>';

  const rows=sorted(filtered()).map(function(v){
    const t=phaseTotals(v), vs=vesselById(v.vesselId), ch=charterById(v.chartererId);
    const ld=layDiff(v,t);
    const loadJ=v.loadJettyIds.length? v.loadJettyIds.map(function(j){return jettyById(j)?jettyById(j).pelabuhan:'—';}).filter(function(x,i,a){return a.indexOf(x)===i;}).join(' & ') : '—';
    const disJ=jettyById(v.dischJettyId)? jettyById(v.dischJettyId).pelabuhan : '—';
    const waitPctRow=(t.total&&t.waiting!=null)? Math.round(t.waiting/t.total*100) : null;
    return '<tr class="row-click" onclick="App.openVoyage(\''+v.id+'\')">'+
      '<td>'+esc(vesselShort(vs))+'</td>'+
      '<td class="num" style="text-align:left;font-weight:600">'+esc(v.code)+'</td>'+
      '<td>'+esc(ch?ch.kode:'—')+'</td>'+
      '<td class="num">'+fmtHr(totalMT(v),0)+'</td>'+
      '<td>'+esc(loadJ)+' → '+esc(disJ)+'<div class="sub-cell">'+esc(v.loadJettyIds.map(jettyName).join(' & ')||'—')+' ▸ '+esc(jettyName(v.dischJettyId))+'</div></td>'+
      '<td class="num" style="text-align:left">'+(t.mulai?t.mulai.getDate()+' '+MMM[t.mulai.getMonth()]:'—')+'</td>'+
      '<td class="num" style="text-align:left">'+(t.selesai?t.selesai.getDate()+' '+MMM[t.selesai.getMonth()]:'—')+'</td>'+
      '<td class="num" style="font-weight:600">'+fmtHr(t.total)+'</td>'+
      '<td class="num '+(waitPctRow!=null&&waitPctRow>=35?'res-neg':'')+'">'+fmtHr(t.waiting)+(waitPctRow!=null?' <span class="sub-cell">('+waitPctRow+'%)</span>':'')+'</td>'+
      '<td class="num '+(ld!=null&&ld>0?'res-neg':(ld!=null?'res-pos':''))+'">'+fmtHr(t.port)+(v.laytime!=null?' / '+v.laytime:'')+'</td>'+
      '<td>'+statusChip(v)+'</td></tr>';
  }).join('');

  return intro+
  '<div class="page-head"><div><div class="eyebrow">PT HUA Agro Trans · armada CPO</div><h1>Rekap voyage</h1></div>'+
  '<div style="display:flex;gap:10px"><button class="btn sec" onclick="App.exportCSV()">Export CSV</button>'+
  '<button class="btn pri" onclick="App.formVoyage()">+ Voyage baru</button></div></div>'+
  '<div class="kpis">'+
    kpiTile('Waktu menunggu', waitPct==null?'—':fmtHr(waitPct)+'<small>%</small>','', 'dari waktu armada · voyage selesai', waitPct!=null&&waitPct>=30?'warn':'good')+
    kpiTile('Hari armada tercatat', fmtHr(allTot,0),'', state.voyages.length+' voyage, 2026','')+
    kpiTile('Voyage berjalan', berjalan,'', (state.voyages.length-berjalan)+' selesai','')+
    kpiTile('Kelebihan laytime', fmtHr(over),'hr','indikasi vs kontrak · voyage selesai', over>0?'warn':'good')+
  '</div>'+filterBar+
  '<div class="card tbl-wrap"><table class="tbl compact"><thead><tr>'+
    '<th>Kapal</th>'+thSort('voy','Voy','left')+'<th>Charterer</th><th style="text-align:right">MT</th><th>Rute · jetty</th>'+
    thSort('mulai','Mulai','left')+'<th>Selesai</th>'+thSort('total','Σ hari','right')+thSort('tunggu','Tunggu','right')+
    thSort('port','Pelabuhan / laytime','right')+'<th>Status</th>'+
  '</tr></thead><tbody>'+(rows||'<tr><td colspan="11" class="empty">Tidak ada voyage yang cocok.</td></tr>')+'</tbody></table></div>'+
  '<div class="fine">Tunggu = seluruh waktu menunggu (sandar, muat, cast off, bongkar) termasuk jeda yang tidak tercatat di log. Pelabuhan / laytime = total waktu di pelabuhan dibanding laytime kontrak — merah bila melebihi.</div>';
}
function kpiTile(label,val,unit,sub,mood){
  return '<div class="kpi '+(mood||'')+'"><div class="k-label">'+label+'</div>'+
    '<div class="k-val">'+val+(unit?'<small>'+unit+'</small>':'')+'</div>'+
    '<div class="k-sub">'+sub+'</div></div>';
}
/* ---------- view: voyage detail ---------- */
function viewVoyage(id){
  const v=voyageById(id);
  if(!v) return '<div class="empty">Voyage tidak ditemukan.</div>';
  const vs=vesselById(v.vesselId), ch=charterById(v.chartererId);
  const t=phaseTotals(v), acts=actsOf(v), gaps=gapsOf(v);
  const ld=layDiff(v,t), dem=demEst(v,t), ong=ongoingAct(v);

  /* timeline */
  const gapAfter={}; gaps.forEach(function(g){ gapAfter[g.after]=g; });
  let tl='';
  acts.forEach(function(a,i){
    const ty=typeById(a.typeId), d=durOf(a);
    const ongoing=!a.end;
    tl+='<div class="tl-row'+(ongoing?' tl-ongoing':'')+'">'+
      '<span class="tl-dot ph-'+ty.ph+'"></span>'+
      '<div class="tl-main"><div class="tl-type">'+esc(ty.label)+(ongoing?' <span class="chip c-load">berlangsung</span>':'')+'</div>'+
      (a.note?'<div class="tl-note">'+esc(a.note)+'</div>':'')+'</div>'+
      '<div class="tl-time">'+fmtDT(a.start)+' →<br>'+(a.end?fmtDT(a.end):'…')+'</div>'+
      '<div class="tl-dur">'+fmtHr(d)+' hr</div>'+
      '<span style="white-space:nowrap">'+
      (ongoing?'<button class="btn pri sm" onclick="App.endAct(\''+v.id+'\',\''+a.id+'\')">Selesaikan</button> ':'')+
      '<button class="x-btn" title="Edit" onclick="App.formAct(\''+v.id+'\',\''+a.id+'\')">✎</button>'+
      '<button class="x-btn" title="Hapus" onclick="App.delAct(\''+v.id+'\',\''+a.id+'\')">✕</button></span></div>';
    const g=gapAfter[i];
    if(g){
      tl+= g.ph==='overlap'
        ? '<div class="tl-gap">⚠ Tumpang tindih jam dengan kegiatan berikut ('+fmtHr(Math.abs(g.days))+' hr) — kemungkinan salah ketik</div>'
        : '<div class="tl-gap"><span>⚠ '+fmtHr(g.days)+' hari tidak tercatat di log</span><span>dihitung sebagai '+PH_LABEL[g.ph].toLowerCase()+'</span></div>';
    }
  });
  const tlCard='<div class="card"><div class="card-h"><h3>Log kegiatan</h3>'+
    '<button class="btn sec sm" onclick="App.formAct(\''+v.id+'\')">+ Tambah kegiatan</button></div>'+
    '<div class="card-b" style="padding-top:4px">'+(acts.length?tl:'<div class="empty">Belum ada kegiatan. <b>Tambah kegiatan</b> pertama — waktu mulai kegiatan berikutnya otomatis menyambung.</div>')+
    '<div class="hint" style="margin-top:10px">Waktu mulai kegiatan baru otomatis = waktu selesai kegiatan sebelumnya, sehingga tidak ada jeda tak tercatat.</div></div></div>';

  /* days strip */
  const strip='<div class="days-strip" style="grid-template-columns:repeat(8,1fr)">'+
    PH_ORDER.map(function(k){ return '<div class="day-box"><div class="lb">'+PH_LABEL[k]+'</div><div class="vl">'+fmtHr(t[k])+'</div></div>'; }).join('')+
    '<div class="day-box tot"><div class="lb">Total hari</div><div class="vl">'+fmtHr(t.total)+'</div></div></div>';

  /* laytime card */
  const layCard='<div class="card"><div class="card-h"><h3>Laytime & demurrage</h3></div><div class="card-b">'+
    '<div class="rc-line"><span class="k">Waktu di pelabuhan (tunggu + muat + bongkar)</span><span class="v">'+fmtHr(t.port)+' hr</span></div>'+
    '<div class="rc-line"><span class="k">Laytime kontrak</span><span class="v">'+(v.laytime==null?'—':v.laytime+' hr')+'</span></div>'+
    '<div class="rc-line"><span class="k">Selisih</span><span class="v '+(ld!=null&&ld>0?'res-neg':'res-pos')+'">'+(ld==null?'—':(ld>0?'+':'')+fmtHr(ld)+' hr')+'</span></div>'+
    '<div class="rc-line"><span class="k">Tarif demurrage</span><span class="v">'+(v.demRate?fmtIDR(v.demRate)+' / hr':'—')+'</span></div>'+
    (dem!=null?'<div class="big-money res-neg">'+fmtIDR(dem)+'</div><div class="hint">Indikasi demurrage — perhitungan resmi mengikuti klausul kontrak (waktu mana yang dihitung sebagai laytime).</div>':'<div class="hint" style="margin-top:8px">Tidak ada indikasi kelebihan laytime'+(v.laytime==null?' (laytime kontrak belum diisi)':'')+'.</div>')+
    '</div></div>';

  /* parcels */
  const pRows=v.parcels.map(function(p){
    return '<div class="rc-line"><span class="k">'+esc(p.commodity)+(p.shipper?' · '+esc(p.shipper):'')+'<div class="sub-cell">'+esc(jettyFull(p.jettyId))+'</div></span>'+
      '<span class="v">'+fmtHr(p.mt,0)+' MT <button class="x-btn" onclick="App.delParcel(\''+v.id+'\',\''+p.id+'\')">✕</button></span></div>';
  }).join('');
  const parcelCard='<div class="card"><div class="card-h"><h3>Muatan</h3>'+
    '<button class="btn sec sm" onclick="App.formParcel(\''+v.id+'\')">+ Parcel</button></div><div class="card-b">'+
    (v.parcels.length? pRows+'<div class="rc-line"><span class="k" style="font-weight:600">Total</span><span class="v" style="font-weight:600">'+fmtHr(totalMT(v),0)+' MT</span></div>'
     :'<div class="empty">Belum ada muatan. Satu voyage bisa berisi beberapa parcel dari jetty berbeda.</div>')+'</div></div>';

  /* economics */
  const res=(v.freight!=null&&v.fuelUsed!=null&&v.bunkerPrice!=null)? v.freight-(v.fuelUsed*v.bunkerPrice):null;
  const ecoCard='<div class="card"><div class="card-h"><h3>Ekonomi voyage</h3>'+
    '<button class="btn sec sm" onclick="App.formVoyage(\''+v.id+'\')">Isi / ubah</button></div><div class="card-b">'+
    '<div class="rc-line"><span class="k">Freight (kontrak)</span><span class="v">'+(v.freight==null?'belum diisi':fmtIDR(v.freight))+'</span></div>'+
    '<div class="rc-line"><span class="k">BBM terpakai</span><span class="v">'+(v.fuelUsed==null?'belum diisi':fmtHr(v.fuelUsed,0)+' L')+'</span></div>'+
    '<div class="rc-line"><span class="k">Harga bunker</span><span class="v">'+(v.bunkerPrice==null?'belum diisi':fmtIDR(v.bunkerPrice)+' / L')+'</span></div>'+
    (res!=null?'<div class="big-money '+(res>=0?'res-pos':'res-neg')+'">'+fmtIDR(res)+'</div><div class="hint">Hasil setelah BBM saja — biaya pelabuhan & lain belum dihitung.</div>'
      :'<div class="hint" style="margin-top:8px">Data ini tidak ada di time sheet Excel — kolom sudah siap untuk mulai diisi.</div>')+'</div></div>';

  /* audit log */
  const logRows=(v.log||[]).slice(-4).reverse().map(function(l){
    return '<div class="rc-line"><span class="k">'+esc(l.msg)+'</span><span class="v">'+fmtDT(l.t)+'</span></div>';
  }).join('');

  return '<div class="page-head"><div>'+
    '<button class="linkish" onclick="App.go(\'rekap\')" style="margin-bottom:6px">← Rekap voyage</button>'+
    '<div class="eyebrow">'+esc(vesselShort(vs))+(ch?' · '+esc(ch.nama):'')+'</div>'+
    '<h1>Voyage '+esc(v.code)+'</h1>'+
    '<div class="voy-meta" style="margin-top:6px"><span>Kontrak <b>'+esc(v.kontrak||'—')+'</b></span><span>Invoice <b>'+esc(v.inv||'—')+'</b></span></div></div>'+
    '<div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">'+statusChip(v)+
    (v.status==='Selesai'?'<span class="lock-chip">'+(v.locked?'🔒 terkunci':'🔓 dibuka')+'</span>':'')+
    (v.status==='Berjalan'&&!ong?'<button class="btn pri" onclick="App.completeVoyage(\''+v.id+'\')">Selesaikan voyage</button>':'')+
    '<button class="btn sec" onclick="App.formVoyage(\''+v.id+'\')">Edit data</button>'+
    '<button class="btn sec" onclick="App.printTS(\''+v.id+'\')">Cetak time sheet</button></div></div>'+
    '<div class="card" style="padding:14px 16px"><div class="eyebrow" style="margin-bottom:8px">Hari per fase — dihitung dari log</div>'+strip+'</div>'+
    '<div class="detail-grid2">'+
      '<div>'+tlCard+'</div>'+
      '<div>'+layCard+'<div style="height:16px"></div>'+parcelCard+'<div style="height:16px"></div>'+ecoCard+
      (logRows?'<div style="height:16px"></div><div class="card"><div class="card-h"><h3>Riwayat perubahan</h3></div><div class="card-b">'+logRows+'</div></div>':'')+'</div>'+
    '</div>';
}

/* ---------- view: analytics ---------- */
function viewAnalitik(){
  const done=state.voyages.filter(function(v){return v.status==='Selesai';});
  const tot={ballast:0,wl:0,load:0,laden:0,wd:0,dis:0,prep:0};
  let grand=0;
  done.forEach(function(v){ const t=phaseTotals(v); PH_ORDER.forEach(function(k){tot[k]+=t[k];}); grand+=t.total||0; });
  const maxPh=Math.max.apply(null, PH_ORDER.map(function(k){return tot[k];}));
  const bars=PH_ORDER.map(function(k){
    const cls=(k==='wl'||k==='wd')?'warn':((k==='ballast'||k==='laden')?'mid':'');
    const pct=grand?Math.round(tot[k]/grand*1000)/10:0;
    return '<div class="bar-row"><span class="bar-lab">'+PH_LABEL[k]+'</span>'+
      '<div class="bar-track"><div class="bar-fill '+cls+'" style="width:'+(maxPh?Math.round(tot[k]/maxPh*100):0)+'%"></div></div>'+
      '<span class="bar-val">'+fmtHr(tot[k])+' hr · '+fmtHr(pct)+'%</span></div>';
  }).join('');
  const waitSum=tot.wl+tot.wd;

  const perVessel=state.vessels.map(function(vs){
    const list=done.filter(function(v){return v.vesselId===vs.id;});
    let td=0,tw=0; list.forEach(function(v){const t=phaseTotals(v); td+=t.total||0; tw+=t.waiting||0;});
    return '<tr><td><b>'+esc(vesselShort(vs))+'</b></td><td class="num">'+list.length+'</td>'+
      '<td class="num">'+fmtHr(td)+'</td><td class="num">'+fmtHr(tw)+'</td>'+
      '<td class="num '+(td&&tw/td>=0.35?'res-neg':'')+'">'+(td?fmtHr(tw/td*100,0)+'%':'—')+'</td></tr>';
  }).join('');

  const loc={};
  done.forEach(function(v){
    const t=phaseTotals(v);
    const lj=(v.parcels[0]&&v.parcels[0].jettyId)||v.loadJettyIds[0];
    if(lj&&t.wl){ loc[lj]=loc[lj]||{d:0,n:0}; loc[lj].d+=t.wl; loc[lj].n++; }
    if(v.dischJettyId&&t.wd){ loc[v.dischJettyId]=loc[v.dischJettyId]||{d:0,n:0}; loc[v.dischJettyId].d+=t.wd; loc[v.dischJettyId].n++; }
  });
  const locRows=Object.keys(loc).sort(function(a,b){return loc[b].d-loc[a].d;}).slice(0,8).map(function(j){
    return '<tr><td>'+esc(jettyFull(j))+'</td><td class="num">'+fmtHr(loc[j].d)+'</td><td class="num">'+loc[j].n+'</td></tr>';
  }).join('');

  return '<div class="page-head"><div><div class="eyebrow">Voyage selesai · 2026</div><h1>Analisis waktu armada</h1>'+
    '<div class="page-sub">Semua angka dihitung langsung dari log kegiatan — inilah jawaban yang tidak pernah bisa diberikan file Excel terpisah.</div></div></div>'+
    '<div class="kpis" style="grid-template-columns:repeat(3,1fr)">'+
      kpiTile('Total waktu menunggu', fmtHr(waitSum),'hr', grand?fmtHr(waitSum/grand*100,0)+'% dari waktu armada':'', 'warn')+
      kpiTile('Waktu produktif', fmtHr(tot.load+tot.dis+tot.laden),'hr','muat + bongkar + layar isi','good')+
      kpiTile('Hari armada', fmtHr(grand,0),'hr',done.length+' voyage selesai','')+
    '</div>'+
    '<div class="card"><div class="card-h"><h3>Pembagian waktu per fase</h3></div><div class="card-b">'+bars+'</div></div>'+
    '<div style="height:16px"></div>'+
    '<div class="recap-grid">'+
    '<div class="card"><div class="card-h"><h3>Per kapal</h3></div><div class="card-b" style="padding-top:6px"><table class="tbl">'+
      '<thead><tr><th>Kapal</th><th style="text-align:right">Voy</th><th style="text-align:right">Hari</th><th style="text-align:right">Tunggu</th><th style="text-align:right">%</th></tr></thead><tbody>'+perVessel+'</tbody></table></div></div>'+
    '<div class="card"><div class="card-h"><h3>Tunggu terlama per lokasi</h3></div><div class="card-b" style="padding-top:6px"><table class="tbl">'+
      '<thead><tr><th>Lokasi</th><th style="text-align:right">Hari tunggu</th><th style="text-align:right">Voy</th></tr></thead><tbody>'+
      (locRows||'<tr><td colspan="3" class="empty">Belum ada data.</td></tr>')+'</tbody></table></div></div>'+
    '</div>';
}

function viewMaster(){

    v.loadJettyIds.concat([v.dischJettyId]).forEach(function(j){ if(j) jUse[j]=(jUse[j]||0)+1; });
  });
  const vsRows=state.vessels.map(function(vs){
    return '<div class="rc-line"><span class="k"><b>'+esc(vs.name)+'</b><div class="sub-cell">'+esc(vs.type)+'</div></span><span class="v">'+fmtHr(vs.cap,0)+' MT</span></div>';
  }).join('');
  const jRows=state.jetties.map(function(j){
    return '<div class="rc-line"><span class="k">'+esc(j.nama)+'<div class="sub-cell">'+esc(j.pelabuhan)+'</div></span><span class="v">'+(jUse[j.id]||0)+'×</span></div>';
  }).join('');
  const cRows=state.charterers.map(function(c){
    const n=state.voyages.filter(function(v){return v.chartererId===c.id;}).length;

    '<div class="page-sub">Jetty dan charterer diinput sekali di sini, lalu dipilih dari daftar — nama tidak pernah lagi diketik ulang (dan tidak pernah lagi salah eja).</div></div></div>'+
    '<div class="master-grid">'+
    '<div class="card"><div class="card-h"><h3>Kapal</h3><button class="btn sec sm" onclick="App.formVessel()">+ Tambah</button></div><div class="card-b">'+vsRows+'</div></div>'+
    '<div class="card"><div class="card-h"><h3>Jetty</h3><button class="btn sec sm" onclick="App.formJetty()">+ Tambah</button></div><div class="card-b">'+jRows+'</div></div>'+
    '<div class="card"><div class="card-h"><h3>Charterer</h3><button class="btn sec sm" onclick="App.formCharter()">+ Tambah</button></div><div class="card-b">'+cRows+'</div></div>'+
    '</div>';
}

/* ---------- modal ---------- */
function openModal(title,body,saveLabel,onSaveJs,wide){
  const m=document.getElementById('modal');
  m.innerHTML='<div class="modal-card'+(wide?' wide':'')+'" role="dialog" aria-modal="true">'+
    '<div class="m-h"><h3>'+title+'</h3><button class="x-btn" onclick="App.closeModal()" aria-label="Tutup">✕</button></div>'+
    '<div class="m-b">'+body+'</div>'+
    '<div class="m-f"><button class="btn sec" onclick="App.closeModal()">Batal</button>'+
    '<button class="btn pri" onclick="'+onSaveJs+'">'+saveLabel+'</button></div></div>';
  m.classList.add('open');
  const f=m.querySelector('input,select'); if(f) f.focus();
}
function closeModal(){ const m=document.getElementById('modal'); m.classList.remove('open'); m.innerHTML=''; }
function fld(id,label,type,val,extra){
  return '<div class="field"><label for="'+id+'">'+label+'</label><input id="'+id+'" type="'+(type||'text')+'" value="'+esc(val==null?'':val)+'" '+(extra||'')+'></div>';
}
function sel(id,label,opts,cur){
  return '<div class="field"><label for="'+id+'">'+label+'</label><select id="'+id+'">'+
    opts.map(function(o){return '<option value="'+o[0]+'" '+(o[0]===cur?'selected':'')+'>'+esc(o[1])+'</option>';}).join('')+'</select></div>';
}
function gv(id){ const e=document.getElementById(id); return e?e.value.trim():''; }
function gnn(id){ const s=gv(id).replace(',','.'); if(s==='') return null; const n=parseFloat(s); return isNaN(n)?null:n; }
function addLog(v,msg){ (v.log=v.log||[]).push({t:nowLocal(), msg:msg}); }
function ensureUnlocked(v){
  if(v.status==='Selesai'&&v.locked){
    if(!confirm('Voyage '+v.code+' sudah selesai dan terkunci.\nBuka kunci untuk mengedit? Perubahan akan dicatat di riwayat.')) return false;
    v.locked=false; addLog(v,'Kunci dibuka untuk pengeditan');
  }
  return true;
}

/* ---------- actions ---------- */
const App={
  go:function(n){ state.view={name:n}; render(); },
  openVoyage:function(id){ state.view={name:'voyage',id:id}; render(); },
  dismissIntro:function(){ state.introDismissed=true; persist(); render(); },
  closeModal:closeModal,
  setFilter:function(k,val){ state.ui[k]=val; persist(); render();
    if(k==='q'){ const e=document.querySelector('.filters input[type=search]'); if(e){e.focus(); const n=e.value.length; e.setSelectionRange(n,n);} } },
  sortBy:function(key){ const s=state.ui.sort; if(s.key===key) s.dir=-s.dir; else {s.key=key; s.dir=-1;} persist(); render(); },

  /* voyage header */
  formVoyage:function(id){
    const v=id?voyageById(id):null;
    if(v&&!ensureUnlocked(v)){ render(); return; }
    const code=v?v.code:'V26'+String(state.voyages.length+1).padStart(2,'0');
    const vOpts=state.vessels.map(function(x){return [x.id,vesselShort(x)];});
    const cOpts=[['','—']].concat(state.charterers.map(function(c){return [c.id,c.kode+' — '+c.nama];}));
    const jOpts=[['','—']].concat(state.jetties.map(function(j){return [j.id,j.nama+', '+j.pelabuhan];}));
    openModal(v?'Edit voyage '+esc(v.code):'Voyage baru',
      '<div class="form-3">'+fld('f-code','Kode voyage','text',code)+
      sel('f-vessel','Kapal',vOpts,v?v.vesselId:vOpts[0][0])+
      sel('f-chart','Charterer',cOpts,v?(v.chartererId||''):'')+'</div>'+
      '<div class="f-row">'+fld('f-kontrak','No. kontrak','text',v?v.kontrak:'')+fld('f-inv','No. invoice','text',v?v.inv:'')+'</div>'+
      '<div class="f-sec">Rute</div>'+
      '<div class="f-row">'+sel('f-lj','Jetty muat (utama)',jOpts,v?(v.loadJettyIds[0]||''):'')+
      sel('f-dj','Jetty bongkar',jOpts,v?(v.dischJettyId||''):'')+'</div>'+
      '<div class="hint">Jetty tambahan untuk muat multi-parcel diatur lewat kartu Muatan.</div>'+
      '<div class="f-sec">Kontrak & ekonomi</div>'+
      '<div class="form-3">'+fld('f-lay','Laytime kontrak (hari)','number',v?v.laytime:'','step="0.5"')+
      fld('f-dem','Tarif demurrage (Rp/hari)','number',v?v.demRate:'')+
      fld('f-freight','Freight (Rp)','number',v?v.freight:'')+'</div>'+
      '<div class="f-row">'+fld('f-fuel','BBM terpakai (L)','number',v?v.fuelUsed:'')+
      fld('f-bp','Harga bunker (Rp/L)','number',v?v.bunkerPrice:'')+'</div>',
      v?'Simpan':'Buat voyage','App.saveVoyage(\''+(id||'')+'\')',true);
  },
  saveVoyage:function(id){
    if(!gv('f-code')) return;
    const data={code:gv('f-code'),vesselId:gv('f-vessel'),chartererId:gv('f-chart')||null,
      kontrak:gv('f-kontrak'),inv:gv('f-inv'),
      loadJettyIds:gv('f-lj')?[gv('f-lj')]:[],dischJettyId:gv('f-dj')||null,
      laytime:gnn('f-lay'),demRate:gnn('f-dem'),freight:gnn('f-freight'),fuelUsed:gnn('f-fuel'),bunkerPrice:gnn('f-bp')};
    if(id){ const v=voyageById(id); if(!v) return;
      if(v.loadJettyIds.length>1) data.loadJettyIds=v.loadJettyIds; /* jangan timpa multi-jetty */
      Object.assign(v,data); addLog(v,'Data voyage diubah');
      closeModal(); persist(); App.openVoyage(id);
    } else {
      const nid=uid('voyage','VY');
      state.voyages.push(Object.assign({id:nid,status:'Berjalan',locked:false,notes:'',
        log:[{t:nowLocal(),msg:'Voyage dibuat'}],parcels:[],acts:[]},data));
      closeModal(); persist(); App.openVoyage(nid);
    }
  },
  completeVoyage:function(id){
    const v=voyageById(id); if(!v) return;
    if(ongoingAct(v)){ alert('Masih ada kegiatan yang berlangsung — selesaikan dulu.'); return; }
    if(!confirm('Tandai voyage '+v.code+' selesai? Data akan dikunci (bisa dibuka lagi dengan catatan).')) return;
    v.status='Selesai'; v.locked=true; addLog(v,'Voyage diselesaikan & dikunci');
    persist(); render();
  },

  /* activities */
  formAct:function(vid,actId){
    const v=voyageById(vid); if(!v||!ensureUnlocked(v)){ render(); return; }
    const a=actId? v.acts.find(function(x){return x.id===actId;}) : null;
    const acts=actsOf(v);
    const lastEnd=acts.length? acts[acts.length-1].end : '';
    const tOpts=TYPES.map(function(t){return [t.id,t.label];});
    openModal(a?'Edit kegiatan':'Tambah kegiatan',
      sel('f-type','Jenis kegiatan',tOpts,a?a.typeId:(acts.length?nextTypeGuess(acts):'ballast'))+
      '<div class="f-row">'+fld('f-start','Mulai','datetime-local',a?a.start:(lastEnd||nowLocal()))+
      fld('f-end','Selesai (kosongkan jika masih berlangsung)','datetime-local',a?a.end:'')+'</div>'+
      fld('f-note','Catatan (mis. parcel / jetty)','text',a?a.note:'')+
      '<div class="hint">Mulai otomatis menyambung dari kegiatan sebelumnya. Jika kegiatan sebelumnya belum ditutup, waktu mulai ini akan menutupnya.</div>',
      a?'Simpan':'Tambah','App.saveAct(\''+vid+'\',\''+(actId||'')+'\')');
  },
  saveAct:function(vid,actId){
    const v=voyageById(vid); if(!v) return;
    if(!gv('f-start')) return;
    const data={typeId:gv('f-type'),start:gv('f-start'),end:gv('f-end')||null,note:gv('f-note')};
    if(data.end&&data.end<=data.start){ alert('Waktu selesai harus setelah waktu mulai.'); return; }
    if(actId){
      const a=v.acts.find(function(x){return x.id===actId;});
      if(a){ Object.assign(a,data); addLog(v,'Kegiatan diubah: '+typeById(a.typeId).label); }
    } else {
      const ong=ongoingAct(v);
      if(ong){ ong.end=data.start; addLog(v,'Kegiatan sebelumnya ditutup otomatis'); }
      v.acts.push(Object.assign({id:uid('act','AC')},data));
      addLog(v,'Kegiatan ditambah: '+typeById(data.typeId).label);
    }
    closeModal(); persist(); render();
  },
  endAct:function(vid,actId){
    const v=voyageById(vid); if(!v||!ensureUnlocked(v)){ render(); return; }
    const a=v.acts.find(function(x){return x.id===actId;}); if(!a) return;
    openModal('Selesaikan kegiatan',
      '<p style="margin:0 0 4px;font-size:14px">'+esc(typeById(a.typeId).label)+'<br><span class="hint">mulai '+fmtDT(a.start)+'</span></p>'+
      fld('f-end','Waktu selesai','datetime-local',nowLocal()),
      'Selesaikan','App.doEndAct(\''+vid+'\',\''+actId+'\')');
  },
  doEndAct:function(vid,actId){
    const v=voyageById(vid); const a=v&&v.acts.find(function(x){return x.id===actId;});
    if(!a||!gv('f-end')) return;
    if(gv('f-end')<=a.start){ alert('Waktu selesai harus setelah waktu mulai.'); return; }
    a.end=gv('f-end'); addLog(v,'Kegiatan diselesaikan: '+typeById(a.typeId).label);
    closeModal(); persist(); render();
  },
  delAct:function(vid,actId){
    const v=voyageById(vid); if(!v||!ensureUnlocked(v)){ render(); return; }
    const a=v.acts.find(function(x){return x.id===actId;}); if(!a) return;
    if(!confirm('Hapus kegiatan "'+typeById(a.typeId).label+'"?')) return;
    v.acts=v.acts.filter(function(x){return x.id!==actId;});
    addLog(v,'Kegiatan dihapus: '+typeById(a.typeId).label);
    persist(); render();
  },

  /* parcels */
  formParcel:function(vid){
    const v=voyageById(vid); if(!v||!ensureUnlocked(v)){ render(); return; }
    const jOpts=state.jetties.map(function(j){return [j.id,j.nama+', '+j.pelabuhan];});
    openModal('Tambah parcel muatan',
      '<div class="f-row">'+fld('f-comm','Komoditas','text','CPO','list="comms"')+fld('f-mt','Tonase (MT)','number','')+'</div>'+
      sel('f-jetty','Jetty muat',jOpts,v.loadJettyIds[0]||jOpts[0][0])+
      fld('f-ship','Pemilik / shipper','text','')+
      '<datalist id="comms">'+COMMODITIES.map(function(c){return '<option value="'+c+'">';}).join('')+'</datalist>',
      'Tambah','App.saveParcel(\''+vid+'\')');
  },
  saveParcel:function(vid){
    const v=voyageById(vid); if(!v) return;
    if(gnn('f-mt')==null) return;
    v.parcels.push({id:uid('parcel','PR'),commodity:gv('f-comm')||'CPO',mt:gnn('f-mt'),jettyId:gv('f-jetty')||null,shipper:gv('f-ship')});
    if(gv('f-jetty')&&v.loadJettyIds.indexOf(gv('f-jetty'))<0) v.loadJettyIds.push(gv('f-jetty'));
    addLog(v,'Parcel ditambah');
    closeModal(); persist(); render();
  },
  delParcel:function(vid,pid){
    const v=voyageById(vid); if(!v||!ensureUnlocked(v)){ render(); return; }
    if(!confirm('Hapus parcel ini?')) return;
    v.parcels=v.parcels.filter(function(p){return p.id!==pid;});
    addLog(v,'Parcel dihapus'); persist(); render();
  },

  /* master */
  formVessel:function(){
    openModal('Tambah kapal',
      fld('f-name','Nama set (TB / BG)','text','')+
      '<div class="f-row">'+fld('f-type','Jenis','text','Tug & barge set (CPO)')+fld('f-cap','Kapasitas (MT)','number','')+'</div>',
      'Simpan','App.saveVessel()');
  },
  saveVessel:function(){
    if(!gv('f-name')) return;
    state.vessels.push({id:uid('vessel','VS'),name:gv('f-name'),type:gv('f-type')||'—',cap:gnn('f-cap')||0,status:'Aktif'});
    closeModal(); persist(); render();
  },
  formJetty:function(){
    openModal('Tambah jetty',
      fld('f-name','Nama jetty','text','')+fld('f-port','Pelabuhan / kota','text',''),
      'Simpan','App.saveJetty()');
  },
  saveJetty:function(){
    if(!gv('f-name')) return;
    state.jetties.push({id:uid('jetty','J'),nama:gv('f-name'),pelabuhan:gv('f-port')||'—'});
    closeModal(); persist(); render();
  },
  formCharter:function(){
    openModal('Tambah charterer',
      '<div class="f-row">'+fld('f-kode','Kode (mis. PNLF)','text','')+fld('f-nama','Nama lengkap','text','')+'</div>',
      'Simpan','App.saveCharter()');
  },
  saveCharter:function(){
    if(!gv('f-kode')) return;
    state.charterers.push({id:uid('charterer','C'),kode:gv('f-kode').toUpperCase(),nama:gv('f-nama')||gv('f-kode').toUpperCase()});
    closeModal(); persist(); render();
  },

  /* outputs */
  printTS:function(id){
    const v=voyageById(id); if(!v) return;
    const vs=vesselById(v.vesselId), t=phaseTotals(v);
    const acts=actsOf(v);
    const rows=acts.map(function(a){
      return '<tr><td>'+esc(typeById(a.typeId).label)+(a.note?' <i>('+esc(a.note)+')</i>':'')+'</td>'+
        '<td class="num">'+fmtDT(a.start)+'</td><td class="num">'+(a.end?fmtDT(a.end):'berlangsung')+'</td>'+
        '<td class="num">'+fmtHr(durOf(a))+'</td></tr>';
    }).join('');
    const A=Math.round((t.wl+t.load)*10)/10, B=Math.round((t.wd+t.dis)*10)/10;
    const ld=layDiff(v,t);
    document.getElementById('print-sheet').innerHTML=
      '<div class="ps-head"><div class="ps-co">HUA AGRO TRANS<small>HUA Investama Group · Pontianak — Jakarta</small></div>'+
      '<div class="ps-inv"><div class="t">TIME SHEET</div><div>VOY. '+esc(v.code)+'</div></div></div>'+
      '<div class="ps-meta">'+
      '<div><b>Kapal</b> '+esc(vs?vs.name:'—')+'</div><div><b>No. Kontrak</b> '+esc(v.kontrak||'—')+'</div>'+
      '<div><b>Muatan</b> '+esc((v.parcels[0]?v.parcels[0].commodity:'—'))+' '+fmtHr(totalMT(v),0)+' MT</div>'+
      '<div><b>No. Invoice</b> '+esc(v.inv||'—')+'</div>'+
      '<div><b>Lokasi Muat</b> '+esc(v.loadJettyIds.map(jettyFull).join(' & ')||'—')+'</div>'+
      '<div><b>Laytime Kontrak</b> '+(v.laytime==null?'—':v.laytime+' hari')+'</div>'+
      '<div><b>Lokasi Bongkar</b> '+esc(jettyFull(v.dischJettyId))+'</div>'+
      '<div><b>Demurrage</b> '+(v.demRate?fmtIDR(v.demRate)+' / hari':'—')+'</div></div>'+
      '<table><thead><tr><th>Kegiatan</th><th style="text-align:right">Mulai</th><th style="text-align:right">Selesai</th><th style="text-align:right">Hari</th></tr></thead>'+
      '<tbody>'+rows+'</tbody><tfoot>'+
      '<tr><td colspan="3">Total kegiatan pelabuhan muat (A)</td><td class="num">'+fmtHr(A)+'</td></tr>'+
      '<tr><td colspan="3">Total kegiatan pelabuhan bongkar (B)</td><td class="num">'+fmtHr(B)+'</td></tr>'+
      '<tr><td colspan="3">Total A + B vs laytime kontrak '+(v.laytime==null?'':'('+v.laytime+' hari)')+'</td><td class="num">'+fmtHr(t.port)+(ld!=null?' ('+(ld>0?'+':'')+fmtHr(ld)+')':'')+'</td></tr>'+
      '</tfoot></table>'+
      '<div class="ps-sig"><div>Dibuat Oleh,<div class="line">( .............................. )<br>Operasional</div></div>'+
      '<div>Diketahui Oleh,<div class="line">( .............................. )<br>Direktur Utama</div></div></div>'+
      '<div class="ps-foot">Seluruh angka hari dihitung otomatis dari log kegiatan — dokumen prototipe.</div>';
    window.print();
  },
  exportCSV:function(){
    const D=';';
    const dec=function(n){ return n==null?'':String(n).replace('.',','); };
    const q=function(s){ s=String(s==null?'':s); return '"'+s.replace(/"/g,'""')+'"'; };
    const head=['Kapal','Voyage','Charterer','No Kontrak','No Invoice','Muatan MT','Jetty Muat','Jetty Bongkar','Mulai','Selesai',
      'Ballast','Tunggu Muat','Muat','Layar Isi','Tunggu Bongkar','Bongkar','Persiapan','Total Hari','Waktu Pelabuhan','Laytime Kontrak','Selisih','Status'].join(D);
    const lines=sorted(filtered()).map(function(v){
      const t=phaseTotals(v), ch=charterById(v.chartererId);
      return [q(vesselShort(vesselById(v.vesselId))),q(v.code),q(ch?ch.kode:''),q(v.kontrak),q(v.inv),dec(totalMT(v)),
        q(v.loadJettyIds.map(jettyName).join(' & ')),q(jettyName(v.dischJettyId)),
        t.mulai?t.mulai.toISOString().slice(0,10):'', t.selesai?t.selesai.toISOString().slice(0,10):'',
        dec(t.ballast),dec(t.wl),dec(t.load),dec(t.laden),dec(t.wd),dec(t.dis),dec(t.prep),dec(t.total),dec(t.port),
        dec(v.laytime),dec(layDiff(v,t)),q(v.status)].join(D);
    });
    const blob=new Blob(['\ufeff'+head+'\r\n'+lines.join('\r\n')],{type:'text/csv;charset=utf-8'});
    const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='rekap-voyage-hua-agro-trans.csv';
    document.body.appendChild(a); a.click();
    setTimeout(function(){URL.revokeObjectURL(a.href); a.remove();},400);
  },
  exportJSON:function(){
    const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});
    const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='hua-agro-trans-voyage-data.json';
    document.body.appendChild(a); a.click();
    setTimeout(function(){URL.revokeObjectURL(a.href); a.remove();},400);
  },
  resetDemo:function(){
    if(!confirm('Kembalikan ke 10 voyage asli dari time sheet Excel? Perubahan Anda akan hilang.')) return;
    state=seedState(); persist(); render();
  }
};
window.App=App;

function nextTypeGuess(acts){
  const last=acts[acts.length-1], ph=typeById(last.typeId).ph;
  const map={ballast:'tunggu-sandar-m', wl:(last.typeId==='tunggu-sandar-m'?'tunggu-muat':(last.typeId==='tunggu-castoff'?'laden':'muat')),
    load:'tunggu-castoff', laden:'tunggu-sandar-b', wd:(last.typeId==='tunggu-sandar-b'?'tunggu-bongkar':'bongkar'), dis:'persiapan', prep:'ballast'};
  return map[ph]||'ballast';
}

/* ---------- render & init ---------- */
function render(){
  const navDef=[['rekap','Rekap voyage'],['analitik','Analisis'],['master','Data master']];
  const counts={rekap:state.voyages.length, analitik:'', master:state.jetties.length};
  const cur=state.view.name==='voyage'?'rekap':state.view.name;
  document.getElementById('nav').innerHTML=navDef.map(function(n){
    return '<button class="nav-btn'+(cur===n[0]?' on':'')+'" onclick="App.go(\''+n[0]+'\')">'+
      '<span>'+n[1]+'</span><span class="n">'+(counts[n[0]]||'')+'</span></button>';
  }).join('');
  let html='';
  if(state.view.name==='rekap') html=viewRekap();
  else if(state.view.name==='voyage') html=viewVoyage(state.view.id);
  else if(state.view.name==='analitik') html=viewAnalitik();
  else if(state.view.name==='master') html=viewMaster();
  document.getElementById('main').innerHTML=html;
}
document.addEventListener('keydown',function(e){ if(e.key==='Escape') closeModal(); });
(async function(){
  const saved=await restore();
  state=(saved&&saved.voyages)?saved:seedState();
  if(!state.view) state.view={name:'rekap'};
  if(!state.ui) state.ui={q:'',vessel:'',status:'',sort:{key:'mulai',dir:-1}};
  render();
})();
</script>
