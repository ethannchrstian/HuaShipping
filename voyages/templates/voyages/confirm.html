{% extends "base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<p class="text-[14px] text-ink-soft"><a href="{% url 'rekap' %}" class="font-[550] text-action hover:underline">Ringkasan</a> <span class="text-ink-faint">/</span> <a href="{% url 'voyage_detail' voyage.pk %}" class="font-[550] text-action hover:underline">{{ voyage.code }}</a></p>
<div class="card mx-auto mt-8 max-w-xl animate-rise p-6">
  <h1 class="text-[22px] font-bold tracking-tight">{{ title }}</h1>
  <p class="mt-2 text-[15px] text-ink-soft">{{ body }}</p>
  {% for c in cautions %}
    <p class="mt-3 rounded-lg bg-live-bg px-4 py-3 text-[14px] text-live-ink">Perhatian: {{ c }}</p>
  {% endfor %}
  <form method="post" class="mt-5 flex items-center gap-2.5">
    {% csrf_token %}
    <button type="submit" class="btn {% if danger %}btn-danger{% else %}btn-primary{% endif %}">{{ confirm_label }}</button>
    <a class="btn btn-secondary" href="{% url 'voyage_detail' voyage.pk %}">Batal</a>
  </form>
</div>
{% endblock %}
