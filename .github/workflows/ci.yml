name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Lint
        run: ruff check .
      - name: Tests
        run: pytest -q
      - name: Django checks
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run
      - name: Production hardening check
        env:
          DJANGO_DEBUG: "false"
          DJANGO_SECRET_KEY: "ci-only-dummy-secret-key-0123456789-abcdefghijklmnopqrstuvwxyz"
          DJANGO_ALLOWED_HOSTS: "example.com"
        run: python manage.py check --deploy --fail-level WARNING
